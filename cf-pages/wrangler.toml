# 本地开发配置（wrangler pages dev 用）
# 线上配置请在 Cloudflare Dashboard 完成：Pages 项目 -> Settings -> D1 database bindings

name = "unmanned-supermarket-cf"
compatibility_date = "2024-09-23"

# 本地 D1（miniflare 会自动创建本地 SQLite）
[[d1_databases]]
binding = "DB"
database_name = "unmanned-supermarket"
database_id = "local"

[vars]
AUTH_SECRET = "dev-secret-change-me"
