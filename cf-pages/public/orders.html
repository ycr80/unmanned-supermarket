<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单管理 - 无人自助超市</title>
  <link href="/css/bootstrap.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
  <div id="nav"></div>
  <div class="container">
    <h3>订单管理</h3>
    <div style="margin-bottom: 16px;">
      <a href="order-form.html" class="btn btn-primary">+ 顾客选购下单</a>
    </div>
    <div id="box"></div>
  </div>

  <script src="/js/jquery.min.js"></script>
  <script src="/js/bootstrap.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    window.PAGE = 'orders';
    renderNav();

    (async () => {
      try {
        const list = await API.get('/api/orders');
        const box = document.getElementById('box');
        if (list.length === 0) {
          box.innerHTML = '<p class="text-muted">暂无订单</p>';
          return;
        }
        const isAdmin = window.currentUser && window.currentUser.role === 'admin';
        box.innerHTML = `
          <table class="table table-bordered table-hover bg-white">
            <tr><th>订单号</th><th>顾客</th><th>商品明细</th><th>总价（元）</th><th>状态</th><th>下单时间</th><th>操作</th></tr>
            ${list.map((o) => `
              <tr>
                <td>${esc(o.order_no)}</td>
                <td>${esc(o.customer)}</td>
                <td>${(o.items || []).map((it) => `${esc(it.name)} × ${it.quantity}（${fmt(it.price)} 元）`).join('<br/>') || '-'}</td>
                <td>${fmt(o.total_amount)}</td>
                <td><span class="label label-success">${esc(o.status)}</span></td>
                <td>${esc(o.created_at)}</td>
                <td>${isAdmin ? `<button class="btn btn-xs btn-danger" onclick="del(${o.id})">删除</button>` : ''}</td>
              </tr>`).join('')}
          </table>`;
      } catch (e) {
        alert(e.message);
      }
    })();

    async function del(id) {
      if (!confirm('确定删除该订单吗？')) return;
      try {
        await API.del('/api/orders/' + id);
        location.reload();
      } catch (e) { alert(e.message); }
    }
  </script>
</body>

</html>
