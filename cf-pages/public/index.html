<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 无人自助超市</title>
  <link href="/css/bootstrap.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
  <div class="login-wrap">
    <h3>🛒 无人自助超市系统</h3>
    <div id="err" class="alert alert-danger" style="display: none;"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>登录角色</label>
        <select id="role" class="form-control">
          <option value="admin">管理员</option>
          <option value="staff">员工</option>
        </select>
      </div>
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="username" class="form-control" required maxlength="50" placeholder="管理员：admin / 员工：staff" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" class="form-control" required maxlength="50" placeholder="默认密码：admin123 / staff123" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <p class="text-muted" style="margin-top: 12px; font-size: 12px;">首次部署请先访问一次 <code>/api/init</code> 初始化数据</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
          }),
          credentials: 'same-origin',
        });
        const data = await res.json();
        if (!res.ok || data.code !== 0) {
          err.textContent = data.message || '登录失败';
          err.style.display = 'block';
          return;
        }
        location.href = 'dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>

</html>
