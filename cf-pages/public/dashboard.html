<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首页统计 - 无人自助超市</title>
  <link href="/css/bootstrap.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
  <div id="nav"></div>
  <div class="container">
    <h3>首页统计</h3>
    <div class="row" id="statCards"></div>
    <div class="row">
      <div class="col-md-6">
        <div class="panel panel-default">
          <div class="panel-heading">库存预警商品 <span class="pull-right"><a href="purchase-form.html">去进货 →</a></span></div>
          <div class="panel-body" id="lowStockBox"></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="panel panel-default">
          <div class="panel-heading">最近订单</div>
          <div class="panel-body" id="recentBox"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/jquery.min.js"></script>
  <script src="/js/bootstrap.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    window.PAGE = 'dashboard';
    renderNav();
    (async () => {
      try {
        const s = await API.get('/api/stats');
        document.getElementById('statCards').innerHTML = `
          <div class="col-xs-6 col-md-3"><div class="stat-card"><div>商品总数</div><div class="num">${s.productCount}</div></div></div>
          <div class="col-xs-6 col-md-3"><div class="stat-card warn"><div>库存预警商品</div><div class="num">${s.lowStockCount}</div></div></div>
          <div class="col-xs-6 col-md-3"><div class="stat-card success"><div>订单总数</div><div class="num">${s.orderCount}</div></div></div>
          <div class="col-xs-6 col-md-3"><div class="stat-card"><div>销售总额（元）</div><div class="num">${fmt(s.totalSales)}</div></div></div>`;
        const low = document.getElementById('lowStockBox');
        low.innerHTML = s.lowStockProducts.length === 0
          ? '<p class="text-muted">暂无预警商品，库存状态良好</p>'
          : '<table class="table table-bordered"><tr><th>商品</th><th>库存</th><th>安全线</th></tr>' +
            s.lowStockProducts.map((p) =>
              `<tr><td>${esc(p.name)}</td><td class="low-stock">${p.stock} ${esc(p.unit)}</td><td>${p.safety_stock}</td></tr>`).join('') +
            '</table>';
        const rec = document.getElementById('recentBox');
        rec.innerHTML = s.recentOrders.length === 0
          ? '<p class="text-muted">暂无订单</p>'
          : '<table class="table table-bordered"><tr><th>订单号</th><th>顾客</th><th>金额（元）</th></tr>' +
            s.recentOrders.map((o) =>
              `<tr><td>${esc(o.order_no)}</td><td>${esc(o.customer)}</td><td>${fmt(o.total_amount)}</td></tr>`).join('') +
            '</table>';
      } catch (e) {
        alert(e.message);
      }
    })();
  </script>
</body>

</html>
