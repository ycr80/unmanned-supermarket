<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新建进货单 - 无人自助超市</title>
  <link href="/css/bootstrap.css" rel="stylesheet" />
  <link href="/css/bootstrap-datepicker.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
  <div id="nav"></div>
  <div class="container">
    <h3>新建进货单</h3>
    <div id="err" class="alert alert-danger" style="display:none;"></div>
    <div class="panel panel-default"><div class="panel-body">
      <form id="purchaseForm">
        <div class="row">
          <div class="col-md-6"><div class="form-group"><label>商品 *</label>
            <select name="product" id="product" class="form-control" required><option value="">加载中...</option></select>
          </div></div>
          <div class="col-md-3"><div class="form-group"><label>进货数量 *</label>
            <input type="number" name="quantity" min="1" class="form-control" required /></div></div>
          <div class="col-md-3"><div class="form-group"><label>进价（元）*</label>
            <input type="number" name="cost" step="0.01" min="0" class="form-control" required /></div></div>
        </div>
        <div class="row">
          <div class="col-md-6"><div class="form-group"><label>供应商</label>
            <input type="text" name="supplier" class="form-control" /></div></div>
          <div class="col-md-6"><div class="form-group"><label>进货日期 *</label>
            <input type="text" name="date" id="date" class="form-control" required /></div></div>
        </div>
        <div class="form-group"><label>备注</label>
          <textarea name="remark" class="form-control" rows="2" maxlength="500"></textarea></div>
        <hr />
        <button type="submit" class="btn btn-primary">提交进货单</button>
        <a href="purchases.html" class="btn btn-default">返回列表</a>
      </form>
    </div></div>
  </div>

  <script src="/js/jquery.min.js"></script>
  <script src="/js/bootstrap.min.js"></script>
  <script src="/js/bootstrap-datepicker.min.js"></script>
  <script src="/js/bootstrap-datepicker.zh-CN.min.js"></script>
  <script src="/js/common.js"></script>
  <script>
    window.PAGE = 'purchases';
    renderNav();

    (async () => {
      try {
        const products = await API.get('/api/products');
        const sel = document.getElementById('product');
        sel.innerHTML = '<option value="">请选择商品</option>' +
          products.map((p) =>
            `<option value="${p.id}" data-cost="${p.cost}" data-supplier="${esc(p.supplier)}">${esc(p.name)}（当前库存 ${p.stock} ${esc(p.unit)}）</option>`).join('');
      } catch (e) { alert(e.message); }
    })();

    $('#product').on('change', function () {
      const opt = $(this).find(':selected');
      $('input[name=cost]').val(opt.data('cost') || '');
      $('input[name=supplier]').val(opt.data('supplier') || '');
    });
    $('#date').datepicker({ format: 'yyyy-mm-dd', language: 'zh-CN', autoclose: true, todayBtn: true, todayHighlight: true });

    document.getElementById('purchaseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      const f = e.target;
      try {
        await API.post('/api/purchases', {
          productId: f.product.value,
          quantity: Number(f.quantity.value),
          cost: Number(f.cost.value),
          supplier: f.supplier.value.trim(),
          date: f.date.value.trim(),
          remark: f.remark.value.trim(),
        });
        location.href = 'purchases.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>

</html>
